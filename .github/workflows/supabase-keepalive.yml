# Mantém o Supabase do ATLAS acordado.
# O plano gratuito pausa o projeto depois de ~7 dias sem atividade;
# esta consulta leve a cada 3 dias evita isso.
# A chave usada é a publicável (a mesma que já está em adm/assets/js/config.js).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 12 */3 * *" # a cada 3 dias, ~9h no horário de Brasília
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta o banco
        env:
          SUPABASE_URL: https://qfjkzagivvbltgmjnhzf.supabase.co
          SUPABASE_KEY: sb_publishable_LtbqK7q10GkVp9liWU561w_FAugEYwo
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $code"
          test "$code" = "200"
